
openapi: 3.0.3

info:
  title: API de gestion de bibliothèque
  description: API REST permettant de gérer les auteurs, les livres et les emprunts.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Serveur local

tags:
  - name: Auth
    description: Authentification
  - name: Authors
    description: Gestion des auteurs
  - name: Books
    description: Gestion des livres
  - name: Borrows
    description: Gestion des emprunts

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Author:
      type: object
      properties:
        _id:
          type: string
          example: "6afe7e7f3f878669c658b493"
        first_name:
          type: string
          example: "Jean-Joseph"
        last_name:
          type: string
          example: "Rabearivelo"
        nationality:
          type: string
          example: "Malagasy"

    Book:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
          example: "Presque-Songes"
        isbn:
          type: string
          example: "9789990000002"
        year:
          type: integer
          example: 1934
        available:
          type: boolean
          example: true
        author_id:
          type: string

    Borrow:
      type: object
      properties:
        _id:
          type: string
        user_name:
          type: string
          example: "Rakoto"
        book_id:
          type: string
        borrowed_at:
          type: string
          format: date-time
        returned_at:
          type: string
          format: date-time
          nullable: true

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        message:
          type: string
          example: "Opération réussie"

    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: "Admin123!"

    AuthorInput:
      type: object
      required:
        - first_name
        - last_name
        - nationality
      properties:
        first_name:
          type: string
        last_name:
          type: string
        nationality:
          type: string

    BookInput:
      type: object
      required:
        - title
        - isbn
        - year
        - author_id
      properties:
        title:
          type: string
        isbn:
          type: string
        year:
          type: integer
        available:
          type: boolean
        author_id:
          type: string

    BorrowInput:
      type: object
      required:
        - user_name
        - book_id
      properties:
        user_name:
          type: string
        book_id:
          type: string

security:
  - BearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Connexion et génération d'un token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Connexion réussie
        '401':
          description: Identifiants incorrects
        '422':
          description: Champs obligatoires manquants

  /api/authors:
    get:
      tags: [Authors]
      summary: Lister tous les auteurs
      responses:
        '200':
          description: Liste des auteurs
    post:
      tags: [Authors]
      summary: Ajouter un auteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Auteur créé
        '422':
          description: Données invalides

  /api/authors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Authors]
      summary: Obtenir un auteur par son ID
      responses:
        '200':
          description: Auteur trouvé
        '404':
          description: Auteur introuvable
    put:
      tags: [Authors]
      summary: Modifier un auteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Auteur modifié
        '404':
          description: Auteur introuvable
    delete:
      tags: [Authors]
      summary: Supprimer un auteur
      responses:
        '200':
          description: Auteur supprimé
        '404':
          description: Auteur introuvable

  /api/books:
    get:
      tags: [Books]
      summary: Lister tous les livres
      responses:
        '200':
          description: Liste des livres
    post:
      tags: [Books]
      summary: Ajouter un livre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Livre créé
        '422':
          description: Données invalides

  /api/books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Books]
      summary: Obtenir un livre par son ID
      responses:
        '200':
          description: Livre trouvé
        '404':
          description: Livre introuvable
    put:
      tags: [Books]
      summary: Modifier un livre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Livre modifié
        '404':
          description: Livre introuvable
    delete:
      tags: [Books]
      summary: Supprimer un livre
      responses:
        '200':
          description: Livre supprimé
        '404':
          description: Livre introuvable

  /api/borrows:
    get:
      tags: [Borrows]
      summary: Lister les emprunts
      responses:
        '200':
          description: Liste des emprunts
    post:
      tags: [Borrows]
      summary: Créer un emprunt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowInput'
      responses:
        '201':
          description: Emprunt créé
        '404':
          description: Livre introuvable
        '422':
          description: Livre indisponible ou données invalides

  /api/borrows/{id}/return:
    patch:
      tags: [Borrows]
      summary: Enregistrer le retour d'un livre
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Livre retourné
        '404':
          description: Emprunt introuvable
        '422':
          description: Livre déjà retourné
